groups:
  - name: production_server_alerts
    rules:

      # =========================================================================
      # 1. AVAILABILITY: Service Unreachable (P0 - Page Engineer)
      # =========================================================================
      - alert: ServiceDown
        expr: up{job="flask_app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Flask application instance is DOWN"
          description: "Prometheus has failed to scrape the Flask app for > 1 minute. Pod or container is unresponsive or crashed."

      # =========================================================================
      # 2. RELIABILITY: High 5xx Server Error Percentage (P1 - Critical)
      # In real production, we alert on ERROR RATIO (> 5% of traffic), not absolute count.
      # Guard with (> 0.5 req/s) so low-traffic 1-off errors don't trigger false alerts.
      # =========================================================================
      - alert: HighServerErrorRate
        expr: |
          (
            sum(rate(http_requests_total{http_status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total[5m]))
          ) * 100 > 5
          and
          sum(rate(http_requests_total[5m])) > 0.5
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error rate (> 5% of traffic)"
          description: "Over 5% of incoming user requests are failing with 5xx server errors over the last 5 minutes."

      # =========================================================================
      # 3. LATENCY: Degraded p95 Response Time (P2 - Warning)
      # Alert when 95% of real user requests take longer than 1.0s.
      # =========================================================================
      - alert: DegradedApiLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)) > 1.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API response latency degraded (p95 > 1.0s) on {{ $labels.endpoint }}"
          description: "95th percentile latency on endpoint '{{ $labels.endpoint }}' has exceeded 1.0s for > 3 minutes."

      # =========================================================================
      # 4. INFRASTRUCTURE: Host Resource Saturation (P2 - Warning)
      # Real production servers always alert when CPU or RAM approaches saturation.
      # =========================================================================
      - alert: HostCpuSaturation
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU utilization critical (> 85%)"
          description: "Host CPU utilization has remained above 85% for more than 5 minutes."

      - alert: HostMemorySaturation
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory near exhaustion (> 90%)"
          description: "Host available memory is below 10% (utilization > 90%) for more than 5 minutes."

      # =========================================================================
      # 5. DEPENDENCY: Third-Party / Upstream Gateway Outage (P2 - Warning)
      # Detects when Open-Meteo or external providers return 502/504 gateways.
      # =========================================================================
      - alert: UpstreamGatewayOutage
        expr: sum(rate(http_requests_total{http_status=~"502|504"}[5m])) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Upstream third-party API gateway outage (502 / 504)"
          description: "Upstream external services (e.g., Geocoding/Open-Meteo) are timing out or unreachable."
